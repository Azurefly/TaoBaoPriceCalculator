name: Desktop installers
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'app/**'
      - 'examples/**'
      - 'requirements*.txt'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch:
    inputs:
      channel:
        description: 'preview = ad-hoc self-test; distribution = signed draft (requires credentials)'
        type: choice
        options: [preview, distribution]
        default: preview
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}-${{ inputs.channel || 'preview' }}
  cancel-in-progress: true
env:
  TBPC_RELEASE_CHANNEL: ${{ inputs.channel || 'preview' }}
jobs:
  dependency-lock:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate requested channel
        run: node -e "require('./desktop/release-config.cjs').channel()"
      - name: Resolve shared dependency lock
        working-directory: desktop
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-dependency-lock
          path: desktop/package-lock.json
          if-no-files-found: error
  build:
    needs: dependency-lock
    environment: ${{ inputs.channel == 'distribution' && 'desktop-signing' || 'desktop-preview' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: win
            arch: x64
          - os: macos-15-intel
            target: mac
            arch: x64
          - os: macos-15
            target: mac
            arch: arm64
          - os: ubuntu-22.04
            target: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PYTHONUTF8: '1'
      TBPC_SYSTEM_INSTALL_TESTS: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: desktop-dependency-lock
          path: desktop
      - name: Prepare isolated Mac signing keychain (no fallback)
        if: runner.os == 'macOS' && inputs.channel == 'distribution'
        env:
          MAC_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python scripts/macos_credentials.py prepare
      - name: Validate Windows signing configuration (no fallback)
        if: runner.os == 'Windows' && inputs.channel == 'distribution'
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: node -e "require('./desktop/release-config.cjs').buildConfig(process.env, 'win32')"
      - name: Install Python build dependencies
        run: python -m pip install -r requirements-desktop.txt -r requirements-dev.txt
      - name: Test core, desktop and publication gates
        env:
          TBPC_RELEASE_CHANNEL: preview
        run: |
          set -euo pipefail
          python -m pytest -q
          node --test desktop/tests.cjs desktop/tests-signing.cjs desktop/tests-release.cjs
          node --check desktop/main.cjs
      - name: Freeze backend
        run: python -m PyInstaller --noconfirm --clean desktop/backend.spec
      - name: Test frozen backend
        run: python scripts/check_packaged_backend.py
      - name: Install desktop build dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Build native installer with explicit channel policy
        working-directory: desktop
        env:
          WIN_CSC_LINK: ${{ runner.os == 'Windows' && inputs.channel == 'distribution' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && inputs.channel == 'distribution' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
        run: npx --no-install electron-builder --config builder.config.cjs --${{ matrix.target }} --${{ matrix.arch }} --publish never
      - name: Prepare real Linux installer prerequisites
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libfuse2 xvfb
          sudo modprobe fuse
          test -c /dev/fuse
      - name: Validate final Mac/Windows installer (not just staging)
        if: runner.os != 'Linux'
        run: python scripts/verify_installers.py
      - name: Validate Linux system installation and real FUSE startup
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum python scripts/verify_installers.py
      - name: Remove temporary Mac signing credentials
        if: always() && runner.os == 'macOS' && inputs.channel == 'distribution'
        run: python scripts/macos_credentials.py cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.target }}-${{ matrix.arch }}
          path: release/installer-validation-*.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/installer-validation-*.json
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: desktop-dependency-lock
          path: release-assets
      - name: Verify exact artifacts and independent acceptance gates
        run: python scripts/build_release_manifest.py
      - name: Publish preview OR create signed draft, never promote automatically
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          HEAD=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$HEAD" != "$GITHUB_SHA" ]; then
            echo "Newer main exists; refusing stale publication." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          VERSION=$(node -p "require('./desktop/package.json').version")
          TAG="v$VERSION-preview.$GITHUB_RUN_NUMBER"
          FLAGS=(--prerelease --latest=false)
          TITLE="TaoBaoPriceCalculator $TAG · 开发自测包（未公证）"
          if [ "$TBPC_RELEASE_CHANNEL" = distribution ]; then
            TAG="v$VERSION"
            FLAGS=(--draft --latest=false)
            TITLE="TaoBaoPriceCalculator $TAG · 已签名分发候选（待首次安装验收）"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Existing release left unchanged: $TAG" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release create "$TAG" release-assets/* --target "$GITHUB_SHA" \
            --title "$TITLE" --notes-file release-notes.md "${FLAGS[@]}"
          echo "Created $TAG ($TBPC_RELEASE_CHANNEL). First-install acceptance is not implied." >> "$GITHUB_STEP_SUMMARY"
